apiVersion: apps/v1
kind: Deployment
metadata:
 name: express
spec:
 replicas: 2
 selector:
  matchLabels:
    apps: express
 template:
  metadata:
    labels:
     apps: express
  spec:
    containers:
     - name: express
       image: amitverma5/llp:latest
       ports:
        - containerPort: 3000